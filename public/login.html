<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e31e24">
<title>Employee Sign In · Arawali</title>
<link rel="icon" href="/logo.png">
<link rel="preload" as="image" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="hero">
    <div class="brand">
      <img src="/logo.png" alt="Arawali" width="340" height="138">
      <p class="tagline" lang="hi">क्योंकि सेहत से समझौता नहीं</p>
    </div>
    <svg class="wave" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true">
      <path fill="#ffdd00" d="M0,30 C280,4 540,96 820,90 C1090,84 1270,40 1440,22 L1440,120 L0,120 Z"/>
      <path fill="#f3f3f4" d="M0,48 C280,22 540,114 820,108 C1090,102 1270,58 1440,40 L1440,120 L0,120 Z"/>
    </svg>
  </header>

  <div class="wrap">
    <main class="card">
      <form id="loginForm" novalidate>
        <div class="head">
          <h1>Employee sign in</h1>
          <p>Sign in to start registering customers.</p>
        </div>

        <div class="field">
          <label for="staffName">Your name</label>
          <div class="control" data-for="staffName">
            <span class="lead" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            </span>
            <input id="staffName" name="username" autocomplete="username" placeholder="Enter your name" maxlength="80" aria-describedby="staffName-msg" autofocus>
          </div>
          <div class="msg" id="staffName-msg" role="alert"></div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="control" data-for="password">
            <span class="lead" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
            </span>
            <input id="password" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Staff password" maxlength="100" aria-describedby="password-msg">
            <button class="reveal" id="reveal" type="button" aria-label="Show password" aria-pressed="false">
              <svg class="i-show" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="i-hide" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </div>
          <div class="msg" id="password-msg" role="alert"></div>
        </div>

        <div class="msg" id="form-msg" role="alert" style="margin-top:20px"></div>

        <button class="submit" id="signInBtn" type="submit">
          <span class="label">Sign in</span>
          <svg class="arrow" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
          <svg class="spinner" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"/></svg>
        </button>

        <p class="fine">Don't have the password? Ask your admin.</p>
      </form>
    </main>

    <footer>© Arawali</footer>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const ICON = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#e31e24"/><path d="M12 6.5v7" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="17.3" r="1.5" fill="#fff"/></svg>';
  const btn = $("signInBtn");

  function setMsg(id, text) {
    const box = $(id + "-msg");
    box.className = "msg" + (text ? " show error" : "");
    box.innerHTML = text ? ICON + "<span></span>" : "";
    if (text) box.querySelector("span").textContent = text;
    const control = document.querySelector(`.control[data-for="${id}"]`);
    if (control) control.classList.toggle("is-error", !!text);
  }

  // Remember who uses this device, so they only type their name once.
  try {
    const saved = localStorage.getItem("arawaliStaffName");
    if (saved) { $("staffName").value = saved; $("password").focus(); }
  } catch {}

  $("staffName").addEventListener("input", () => { setMsg("staffName", ""); setMsg("form", ""); });
  $("password").addEventListener("input", () => { setMsg("password", ""); setMsg("form", ""); });

  $("reveal").addEventListener("click", () => {
    const show = $("password").type === "password";
    $("password").type = show ? "text" : "password";
    $("reveal").setAttribute("aria-pressed", String(show));
    $("reveal").setAttribute("aria-label", show ? "Hide password" : "Show password");
    $("reveal").classList.toggle("on", show);
    $("password").focus();
  });

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (btn.disabled) return;
    const name = $("staffName").value.trim().replace(/\s+/g, " ");
    const password = $("password").value;
    if (name.length < 2) { setMsg("staffName", "Enter your name."); return $("staffName").focus(); }
    if (!password) { setMsg("password", "Enter the staff password."); return $("password").focus(); }

    btn.disabled = true;
    btn.classList.add("loading");
    btn.querySelector(".label").textContent = "Signing in…";
    try {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        try { localStorage.setItem("arawaliStaffName", name); } catch {}
        btn.querySelector(".label").textContent = "Signed in";
        location.replace("/");
        return;
      }
      const field = data.field === "name" ? "staffName" : data.field;
      setMsg(field || "form", data.error || "Couldn't sign in. Try again.");
      if (field === "password") { $("password").select(); $("password").focus(); }
    } catch {
      setMsg("form", "Couldn't reach the server. Check your connection and try again.");
    }
    btn.disabled = false;
    btn.classList.remove("loading");
    btn.querySelector(".label").textContent = "Sign in";
  });
</script>
</body>
</html>
