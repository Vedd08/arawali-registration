<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e31e24">
<title>Admin · Arawali</title>
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #e31e24;
    --red-press: #b3141a;
    --red-tint: #fff0f0;
    --yellow: #ffdd00;
    --yellow-tint: #fff8cc;
    --ink: #2b2a29;
    --text: #44403c;
    --muted: #78716c;
    --line: #e7e5e2;
    --page: #f3f3f4;
    --white: #fff;
    --ok: #0f7b45;
    --display: "Baloo 2", "Nirmala UI", system-ui, sans-serif;
    --body: "Mukta", "Nirmala UI", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.5;
    color: var(--text);
    background: var(--page);
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }

  /* ---------- header ---------- */
  .top {
    background: var(--red);
    border-bottom: 5px solid var(--yellow);
  }
  .top-inner {
    max-width: 1040px;
    margin: 0 auto;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .top img { height: 44px; width: auto; display: block; }
  .top h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 800;
    font-size: 1.35rem;
    color: #fff;
    text-shadow: 1px 1px 0 var(--ink);
  }
  .top-actions { margin-left: auto; display: flex; gap: 8px; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border: 1.5px solid rgba(255,255,255,.65);
    border-radius: 999px;
    background: transparent;
    color: #fff;
    font-weight: 600;
    font-size: .95rem;
    text-decoration: none;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color .15s, color .15s;
  }
  .pill:hover { background: #fff; color: var(--red); }

  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }

  /* ---------- admin sign-in ---------- */
  .gate {
    max-width: 380px;
    margin: 48px auto;
    background: var(--white);
    border-radius: 20px;
    border-top: 6px solid var(--yellow);
    padding: 26px 24px 22px;
    box-shadow: 0 1px 2px rgba(43,42,41,.05), 0 20px 40px -16px rgba(43,42,41,.2);
  }
  .gate h2 { margin: 0; font-family: var(--display); font-size: 1.6rem; color: var(--ink); }
  .gate p { margin: 2px 0 18px; color: var(--muted); }

  input[type=text], input[type=password], input[type=search] {
    width: 100%;
    height: 46px;
    padding: 0 14px;
    color: var(--ink);
    background: #fafaf9;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    outline: none;
    transition: border-color .15s, box-shadow .15s, background-color .15s;
  }
  input:focus { background: #fff; border-color: var(--red); box-shadow: 0 0 0 4px rgba(227,30,36,.12); }

  .btn {
    height: 46px;
    padding: 0 18px;
    border: 0;
    border-radius: 10px;
    background: var(--red);
    color: #fff;
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.05rem;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 3px 0 var(--red-press);
    transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--red-press); }
  .btn.quiet { background: #fff; color: var(--ink); border: 1.5px solid var(--line); box-shadow: none; font-family: var(--body); font-weight: 600; font-size: 1rem; }
  .btn.quiet:hover { border-color: var(--ink); }
  .gate .btn { width: 100%; margin-top: 12px; }
  .note { min-height: 1.4em; margin-top: 8px; font-weight: 600; color: var(--red-press); }
  .note.ok { color: var(--ok); }

  /* ---------- sections ---------- */
  .summary {
    margin: 0 0 22px;
    font-size: 1.05rem;
    color: var(--muted);
  }
  .summary strong { color: var(--ink); }
  section + section { margin-top: 36px; }
  .sec-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  h2.sec { margin: 0; font-family: var(--display); font-weight: 800; font-size: 1.45rem; color: var(--ink); }
  .hint { margin: 0 0 12px; color: var(--muted); }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .toolbar input { flex: 1; min-width: 200px; }

  .table-wrap {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid #efedeb; white-space: nowrap; vertical-align: middle; }
  th { font-weight: 600; font-size: .9rem; color: var(--muted); background: #fdfcfa; }
  tr:last-child td { border-bottom: 0; }
  td.num { font-variant-numeric: tabular-nums; }
  td.person { font-weight: 600; color: var(--ink); }
  td .handle { color: var(--red); font-weight: 600; text-decoration: none; }
  td .handle:hover { text-decoration: underline; }
  td.actions { text-align: right; }
  .link {
    padding: 2px 4px;
    border: 0;
    background: none;
    color: var(--muted);
    font-weight: 600;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .link:hover { color: var(--red); }
  .link + .link { margin-left: 10px; }
  .count-link { color: var(--ink); font-weight: 700; }

  .status { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; }
  .status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #c9c5c0; }
  .status.on { color: var(--ok); }
  .status.on::before { background: var(--ok); box-shadow: 0 0 0 3px rgba(15,123,69,.15); }
  .status.off { color: var(--muted); }

  .tag {
    display: inline-block;
    padding: 1px 10px;
    border-radius: 999px;
    background: var(--yellow-tint);
    border: 1px solid #f2e27a;
    font-weight: 600;
    font-size: .95rem;
    color: var(--ink);
  }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); }
  .filter-note { margin: -4px 0 10px; color: var(--muted); }


  @media (max-width: 600px) {
    .top img { height: 36px; }
    .top h1 { font-size: 1.15rem; }
    .pill { padding: 5px 11px; font-size: .9rem; }
    .pill .long { display: none; }
    main { padding-top: 18px; }
  }
</style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <img src="/logo.png" alt="Arawali" width="108" height="44">
      <h1>Admin</h1>
      <nav class="top-actions">
        <a class="pill" href="/">Registration<span class="long">page</span></a>
        <button class="pill" id="lock" type="button" hidden>Lock</button>
      </nav>
    </div>
  </header>

  <main>
    <form class="gate" id="gate" novalidate>
      <h2>Admin sign in</h2>
      <p>Enter the admin password to see registrations.</p>
      <input id="key" name="admin-key" type="password" placeholder="Admin password" autocomplete="off" autofocus>
      <button class="btn" type="submit">Open admin</button>
      <div class="note" id="gateNote" role="alert"></div>
    </form>

    <div id="panel" hidden>
      <p class="summary" id="summary"></p>

      <section id="regSection">
        <div class="sec-head">
          <h2 class="sec">Registrations</h2>
          <span class="tag" id="regTag"></span>
        </div>
        <div class="toolbar">
          <input id="search" type="search" placeholder="Search name, phone, Instagram or reg. no.">
          <button class="btn quiet" id="refresh" type="button">Refresh</button>
          <button class="btn" id="export" type="button">Download CSV</button>
        </div>
        <p class="filter-note" id="filterNote" hidden></p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Reg. no.</th><th>Name</th><th>Phone</th><th>Instagram</th><th>Date</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
          <div class="empty" id="empty" hidden>No registrations yet.</div>
        </div>
      </section>

    </div>
  </main>

<script>
  const $ = (id) => document.getElementById(id);
  let key = "";
  try { key = sessionStorage.getItem("arawaliAdminKey") || ""; } catch {}
  let registrations = [];

  const regNo = (r) => "ARW-" + String(r.serial).padStart(4, "0");
  const when = (iso) => new Date(iso).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
  const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

  function cell(text, cls) {
    const td = document.createElement("td");
    if (cls) td.className = cls;
    td.textContent = text;
    return td;
  }

  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: { "x-admin-key": key, ...(opts.headers || {}) } });
    if (res.status === 401) throw new Error("unauthorized");
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "Request failed. Try again.");
    return res;
  }

  async function load() {
    try {
      const data = await (await api("/api/admin/registrations")).json();
      registrations = data.registrations;
      try { sessionStorage.setItem("arawaliAdminKey", key); } catch {}
      $("gate").hidden = true;
      $("panel").hidden = false;
      $("lock").hidden = false;
      renderSummary();
      renderRegistrations();
    } catch (err) {
      if (err.message === "unauthorized") return lock(key ? "That admin password isn't right." : "");
      if (!$("panel").hidden) return; // keep showing the last data if a background refresh fails
      $("gateNote").textContent = err.message.startsWith("Too many")
        ? err.message
        : "Couldn't load the admin page. Check your connection and try again.";
    }
  }

  function lock(message = "") {
    key = "";
    try { sessionStorage.removeItem("arawaliAdminKey"); } catch {}
    $("panel").hidden = true;
    $("lock").hidden = true;
    $("gate").hidden = false;
    $("gateNote").textContent = message;
    $("key").value = "";
    $("key").focus();
  }

  function renderSummary() {
    const today = new Date().toDateString();
    const todayCount = registrations.filter((r) => new Date(r.createdAt).toDateString() === today).length;
    $("summary").replaceChildren();
    const total = document.createElement("strong");
    total.textContent = plural(registrations.length, "registration");
    const daily = document.createElement("strong");
    daily.textContent = String(todayCount);
    $("summary").append(total, " in total · ", daily, " today");
    $("regTag").textContent = plural(registrations.length, "customer");
  }

  function renderRegistrations() {
    const q = $("search").value.trim().toLowerCase().replace(/^@/, "");
    const list = registrations
      .filter((r) => !q || [r.name, r.phone, r.instagram, regNo(r)].some((v) => v.toLowerCase().includes(q)))
      .reverse(); // newest first

    const note = $("filterNote");
    note.hidden = !q;
    note.textContent = q ? `Showing ${list.length} of ${registrations.length} for “${$("search").value.trim()}”.` : "";

    const tbody = $("rows");
    tbody.replaceChildren();
    $("empty").hidden = list.length > 0;
    $("empty").textContent = registrations.length ? "No registrations match your search." : "No registrations yet.";

    for (const r of list) {
      const tr = document.createElement("tr");
      tr.append(cell(regNo(r), "num"), cell(r.name, "person"), cell("+91 " + r.phone, "num"));

      const ig = document.createElement("td");
      const a = document.createElement("a");
      a.className = "handle";
      a.href = "https://www.instagram.com/" + encodeURIComponent(r.instagram) + "/";
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "@" + r.instagram;
      ig.append(a);

      const actions = document.createElement("td");
      actions.className = "actions";
      const del = document.createElement("button");
      del.type = "button";
      del.className = "link";
      del.textContent = "Remove";
      del.onclick = async () => {
        if (!confirm(`Remove ${regNo(r)}, @${r.instagram} (${r.name})? This Instagram account will be able to register again.`)) return;
        try {
          await api("/api/admin/registrations/" + encodeURIComponent(r.id), { method: "DELETE" });
          await load();
        } catch (err) { alert(err.message); }
      };
      actions.append(del);

      tr.append(ig, cell(when(r.createdAt)), actions);
      tbody.append(tr);
    }
  }

  $("gate").addEventListener("submit", (e) => {
    e.preventDefault();
    key = $("key").value.trim();
    if (!key) { $("gateNote").textContent = "Enter the admin password."; return $("key").focus(); }
    $("gateNote").textContent = "";
    load();
  });
  $("lock").addEventListener("click", () => lock());

  $("search").addEventListener("input", renderRegistrations);
  $("refresh").addEventListener("click", load);
  $("export").addEventListener("click", async () => {
    try {
      const blob = await (await api("/api/admin/export.csv")).blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "arawali-registrations.csv";
      a.click();
      URL.revokeObjectURL(a.href);
    } catch (err) { alert(err.message); }
  });

  // Keep the list current while the page is open.
  setInterval(() => { if (key && !document.hidden) load(); }, 30000);
  document.addEventListener("visibilitychange", () => { if (key && !document.hidden) load(); });

  if (key) load();
</script>
</body>
</html>
